<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grandmaster.AI — Sign In</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <a href="index.html" class="back-to-home">&larr; Back to Home</a>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">♟️ Grandmaster<span>.AI</span></div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to check and track your chess moves</p>
                <div class="lang-switcher" style="margin-top: 12px; display: inline-block;">
                    <button class="lang-btn" onclick="toggleLangMenu()" title="Change Language">🌐 Language</button>
                    <div class="lang-menu" id="langMenu" style="right: auto; left: 0;">
                        <div onclick="changeLang('en')">🇬🇧 English</div>
                        <div onclick="changeLang('hi')">🇮🇳 Hindi</div>
                        <div onclick="changeLang('ar')">🇸🇦 Arabic</div>
                        <div onclick="changeLang('fr')">🇫🇷 French</div>
                        <div onclick="changeLang('es')">🇪🇸 Spanish</div>
                        <div onclick="changeLang('de')">🇩🇪 German</div>
                        <div onclick="changeLang('zh-CN')">🇨🇳 Chinese</div>
                        <div onclick="changeLang('ur')">🇵🇰 Urdu</div>
                    </div>
                </div>
                <!-- Hidden Google Translate Element -->
                <div id="google_translate_element" style="display: none !important;"></div>
            </div>

            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="form-input" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg class="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="auth-checkbox-row">
                    <label class="auth-checkbox-label">
                        <input type="checkbox" class="auth-checkbox">
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Sign In 🚀</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create free account</a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Language Switcher Script -->
    <script>
        function toggleLangMenu() {
            const menu = document.getElementById('langMenu');
            menu.classList.toggle('open');
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.lang-switcher')) {
                document.getElementById('langMenu').classList.remove('open');
            }
        });
        function changeLang(lang) {
            try {
                const cookieVal = (lang === 'en') ? '' : '/en/' + lang;
                document.cookie = "googtrans=" + cookieVal + "; path=/";
                document.cookie = "googtrans=" + cookieVal + "; path=/; domain=" + window.location.hostname;
                
                var select = document.querySelector('select.goog-te-combo');
                if (select) {
                    select.value = lang;
                    select.dispatchEvent(new Event('change'));
                } else {
                    location.reload();
                }
            } catch (e) {
                console.error("Failed to change language: ", e);
            }
        }
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
        if (window.location.protocol === 'file:') {
            console.warn("Google Translate widget requires a local server (http:// or https://) to function properly and set cookies. It won't work correctly when opened directly via file:// protocol.");
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Auth JS file -->
    <script src="auth.js"></script>
</body>
</html>
